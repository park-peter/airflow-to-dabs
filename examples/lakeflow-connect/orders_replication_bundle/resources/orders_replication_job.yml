resources:
  jobs:
    orders_replication_job:
      name: orders-replication-lakeflow
      description: Migrated Lakeflow Job for the orders_replication Airflow DAG.
      tags:
        source: airflow-migration
        source_dag_id: orders_replication
        domain: orders
      max_concurrent_runs: 1

      schedule:
        quartz_cron_expression: "0 0 * * * ?"   # hourly (Airflow "0 * * * *")
        timezone_id: "UTC"
        pause_status: UNPAUSED

      parameters:
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}

      tasks:
        # Triggered ingestion pipeline runs as a pipeline_task hop where the Snowflake
        # replication step sat. (A continuous/streaming connector would instead run
        # standalone with a downstream trigger.table_update — not a pipeline_task.)
        - task_key: replicate_orders
          pipeline_task:
            pipeline_id: ${resources.pipelines.orders_ingestion.id}

        - task_key: transform_orders
          depends_on:
            - task_key: replicate_orders
          notebook_task:
            notebook_path: ../src/transform_orders.py
            base_parameters:
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
