resources:
  jobs:
    customer_orders_lakeflow_job:
      name: customer-orders-lakeflow
      description: Migrated Lakeflow Job for the customer_orders_airflow DAG.
      tags:
        source: airflow-migration
        source_dag_id: customer_orders_airflow
        domain: orders
      max_concurrent_runs: 1
      timeout_seconds: 7200

      trigger:
        pause_status: UNPAUSED
        file_arrival:
          url: ${var.landing_path}
          min_time_between_triggers_seconds: 300
          wait_after_last_change_seconds: 60

      email_notifications:
        on_failure:
          - data-engineering@example.com

      parameters:
        - name: run_date
          default: "{{job.start_time.iso_date}}"
        - name: catalog
          default: ${var.catalog}
        - name: schema
          default: ${var.schema}
        - name: landing_path
          default: ${var.landing_path}
        - name: checkpoint_path
          default: ${var.checkpoint_path}
        - name: min_daily_orders
          default: "100"
        - name: run_full_validation
          default: "true"

      tasks:
        - task_key: ingest_bronze
          description: Replaces the Airflow S3KeySensor plus PythonOperator ingest step.
          max_retries: 2
          min_retry_interval_millis: 300000
          timeout_seconds: 7200
          notebook_task:
            notebook_path: ../src/ingest_bronze.py
            base_parameters:
              run_date: "{{job.parameters.run_date}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              landing_path: "{{job.parameters.landing_path}}"
              checkpoint_path: "{{job.parameters.checkpoint_path}}"

        - task_key: transform_silver
          depends_on:
            - task_key: ingest_bronze
          max_retries: 2
          min_retry_interval_millis: 300000
          timeout_seconds: 7200
          notebook_task:
            notebook_path: ../src/transform_silver.py
            base_parameters:
              run_date: "{{job.parameters.run_date}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"

        - task_key: dq_order_totals
          depends_on:
            - task_key: transform_silver
          timeout_seconds: 1800
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: ../src/dq_order_totals.sql
              source: WORKSPACE
            # Dynamic value references cannot be used inline in SQL files; the
            # file uses :named parameter markers and values are passed here.
            parameters:
              run_date: "{{job.parameters.run_date}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
              min_daily_orders: "{{job.parameters.min_daily_orders}}"

        - task_key: choose_validation
          depends_on:
            - task_key: dq_order_totals
          condition_task:
            left: "{{job.parameters.run_full_validation}}"
            op: EQUAL_TO
            right: "true"

        - task_key: full_validation
          depends_on:
            - task_key: choose_validation
              outcome: "true"
          max_retries: 2
          min_retry_interval_millis: 300000
          timeout_seconds: 7200
          notebook_task:
            notebook_path: ../src/full_validation.py
            base_parameters:
              run_date: "{{job.parameters.run_date}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"

        - task_key: publish_gold
          depends_on:
            - task_key: full_validation
            - task_key: choose_validation
              outcome: "false"
          run_if: AT_LEAST_ONE_SUCCESS
          max_retries: 2
          min_retry_interval_millis: 300000
          timeout_seconds: 7200
          notebook_task:
            notebook_path: ../src/publish_gold.py
            base_parameters:
              run_date: "{{job.parameters.run_date}}"
              catalog: "{{job.parameters.catalog}}"
              schema: "{{job.parameters.schema}}"
