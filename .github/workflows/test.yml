name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Cross-surface and structural contract checks
        run: make test-contracts

  glue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install the example bundle's pinned dbt toolchain
        working-directory: examples/dbt-cosmos/orders_analytics_bundle
        run: uv sync --dev
      - name: dbt glue regression tests
        working-directory: examples/dbt-cosmos/orders_analytics_bundle
        run: uv run pytest tests -q

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code
      - name: Validate the Claude Code plugin and marketplace manifests
        run: make validate-plugin
